<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="home-page">

    <!-- Ambient orb -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Grid overlay -->
    <div class="grid-overlay"></div>

    <!-- Clock -->
    <div class="home-clock" id="home-clock"></div>

    <!-- Center content -->
    <div class="home-content">
      <p class="home-greeting">Good&nbsp;<span id="home-tod"></span></p>
      <h1 class="home-name">Madhusshree</h1>
      <p class="home-sub">Your AI-powered personal command center</p>
      <a href="/world" class="btn-enter">
        Enter Your World
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>
    </div>

    <!-- Bottom version tag -->
    <div class="home-footer">ATLAS &nbsp;·&nbsp; Personal Intelligence</div>
  </div>

  <script>
    // Clock + time-of-day
    function tick() {
      const now = new Date();
      const h = now.getHours();
      const tod = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
      document.getElementById('home-tod').textContent = tod;
      document.getElementById('home-clock').textContent =
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) +
        '  ·  ' +
        now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
